<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Scraper</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body data-view="home">
  <header class="topbar">
    <button id="back" class="icon-btn" type="button" title="Back to tools" hidden>‹</button>
    <img src="../icons/icon32.png" alt="" width="20" height="20">
    <div class="topbar-text">
      <strong id="title">Web Scraper</strong>
      <span id="host" class="muted"></span>
    </div>
  </header>

  <div id="job" class="job" hidden>
    <div class="job-row">
      <span id="job-text" class="grow">Working…</span>
      <button id="job-stop" class="btn danger tiny" type="button">Stop</button>
    </div>
    <div class="job-track"><div id="job-fill" class="job-fill"></div></div>
  </div>

  <main id="view"></main>
  <div id="toast" class="toast" role="status" hidden></div>

  <!-- Engine is also used here to parse pages fetched in the background. -->
  <script src="../content/engine.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
