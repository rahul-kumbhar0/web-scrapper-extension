<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1600px;height:1000px;font-family:Inter,system-ui,sans-serif;background:#0d0f1a;color:#fff;overflow:hidden;position:relative}
.glow{position:absolute;inset:0;background:radial-gradient(800px 500px at 8% 0%,#3b2fb8 0%,transparent 60%),radial-gradient(700px 500px at 100% 100%,#0f8f86 0%,transparent 60%);opacity:.75}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:28px}
.brand img{width:44px;height:44px;border-radius:10px}
h1{font-size:58px;line-height:1.05;font-weight:800;letter-spacing:-2px}
.grad{background:linear-gradient(90deg,#8b80ff,#2fd3c3);-webkit-background-clip:text;color:transparent}
.sub{font-size:22px;color:#b8bdd6}
.pill{display:inline-block;padding:10px 18px;border-radius:999px;font-size:17px;font-weight:600;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);margin-right:10px}
.pill.g{background:linear-gradient(90deg,#6a5cff,#1fb5a6);border:0}
.card{border-radius:18px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.12)}
</style></head><body><div class="glow"></div>
<style>
.top{position:absolute;left:72px;top:56px;right:72px;display:flex;justify-content:space-between;align-items:flex-start}
.stage{position:absolute;left:72px;right:72px;top:250px;display:flex;align-items:center;gap:36px}
.site{width:760px;height:600px}.site img{width:760px;display:block}
.arrow{flex:none;width:150px;text-align:center}
.arrow .a{font-size:72px;line-height:1;background:linear-gradient(90deg,#8b80ff,#2fd3c3);-webkit-background-clip:text;color:transparent;font-weight:800}
.arrow .t{font-size:17px;color:#b8bdd6;margin-top:10px;font-weight:600}
.panel{width:390px;height:640px;background:#fff}.panel img{width:390px;display:block}
.lab{position:absolute;top:212px;font-size:16px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#9aa0c0}
.foot{position:absolute;left:72px;bottom:44px}
</style>
<div class="top"><div><div class="brand"><img src="../icons/icon128.png">PullRows</div>
<h1 style="margin-top:22px">Click once. <span class="grad">Get the whole list.</span></h1></div>
<div class="sub" style="text-align:right;margin-top:8px;max-width:420px">Free Chrome side-panel scraper<br>No code · no account · no selectors</div></div>
<div class="lab" style="left:72px">Any website</div><div class="lab" style="left:1066px">Your spreadsheet</div>
<div class="stage"><div class="card site"><img src="shot-site.png"></div>
<div class="arrow"><div class="a">→</div><div class="t">Auto-detect<br>+ Next pages</div></div>
<div class="card panel"><img src="shot-table.png"></div></div>
<div class="foot"><span class="pill g">Free on the Chrome Web Store</span><span class="pill">Next · Load more · infinite scroll</span><span class="pill">CSV · Excel · Sheets</span></div>
</body></html>
